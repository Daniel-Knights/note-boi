[package]
name = "note-boi-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "AesDerivedKeyParams",
  "AesGcmParams",
  "Crypto",
  "CryptoKey",
  "Pbkdf2Params",
  "SubtleCrypto",
  "Window",
] }
js-sys = { version = "0.3" }
